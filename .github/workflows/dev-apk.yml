name: Dev debug APK

on:
  push:
    branches: [feature/balloon-style]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Replace dev-balloon prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-balloon --yes --cleanup-tag || true
          gh release create dev-balloon app/build/outputs/apk/debug/app-debug.apk \
            --title "Dev build (balloon experiment)" \
            --notes "Build automatica dell'ultimo commit su feature/balloon-style: ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"
